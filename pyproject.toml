[project]
name = "hermes-enterprise-field-kit"
version = "0.0.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"kit/instrument/evaluator.py" = ["E701", "E702", "E703"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "kit/instrument"]
